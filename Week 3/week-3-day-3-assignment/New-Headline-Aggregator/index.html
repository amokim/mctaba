<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headline Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">📰</span>
        <span class="brand-name">Headline Hub</span>
      </div>
      <p class="tagline">Top stories, curated by category</p>

      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark theme"
        aria-pressed="false"
      >
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="page">

    <!-- Category filter -->
    <nav class="category-filter" id="categoryFilter" aria-label="Filter headlines by category">
      <button class="category-btn active" data-category="technology">Technology</button>
      <button class="category-btn" data-category="business">Business</button>
      <button class="category-btn" data-category="sports">Sports</button>
      <button class="category-btn" data-category="health">Health</button>
    </nav>

    <!-- Status area: loading / error -->
    <div id="statusArea" class="status-area" hidden></div>

    <!-- Headlines grid -->
    <section id="headlinesGrid" class="headlines-grid" aria-live="polite"></section>

  </main>

  <footer class="site-footer">
    <p>Powered by <a href="https://gnews.io" target="_blank" rel="noopener noreferrer">Gnews.io</a> &middot; Built by amo</p>
  </footer>

  <!-- Card template -->
  <template id="cardTemplate">
    <article class="headline-card">
      <div class="card-image-wrap">
        <img class="card-image" src="" alt="" loading="lazy" />
        <span class="card-category-badge"></span>
      </div>
      <div class="card-body">
        <h2 class="card-title"></h2>
        <div class="card-meta">
          <span class="card-source"></span>
          <span class="card-dot">&bull;</span>
          <span class="card-date"></span>
        </div>
        <p class="card-description"></p>
        <a class="card-link" href="#" target="_blank" rel="noopener noreferrer">
          Read More
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M7 17L17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
