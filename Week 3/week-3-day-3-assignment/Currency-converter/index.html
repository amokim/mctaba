<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="converter-card">
    <h1>Currency Converter</h1>
    <p id="subtitle">Convert between currencies in real time</p>

    <form id="converter-form">
      <div id="amount-field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" value="1" min="0.01" step="any" inputmode="decimal" required>
      </div>

      <div id="currency-row">
        <div id="from-field">
          <label for="from-currency">From</label>
          <select id="from-currency" name="from-currency">
          </select>
        </div>

        <button type="button" id="swap-btn" aria-label="Swap currencies">⇄</button>

        <div id="to-field">
          <label for="to-currency">To</label>
          <select id="to-currency" name="to-currency">

          </select>
        </div>
      </div>

      <button type="submit" id="convert-btn">Convert</button>
    </form>

    <div id="result" aria-live="polite">
      <span id="result-text">Enter an amount and press Convert</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
