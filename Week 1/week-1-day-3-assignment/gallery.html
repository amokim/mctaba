<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenya in Pictures</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Kenya in Pictures</h1>
  <p>A visual journey through landscapes, cities, and everyday life</p>
</header>

<main class="gallery">
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=1" alt="Kenya scene 1">
    <div class="caption">Sunrise over the savannah</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=2" alt="Kenya scene 2">
    <div class="caption">Nairobi city skyline</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=3" alt="Kenya scene 3">
    <div class="caption">Maasai Mara wildlife</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=4" alt="Kenya scene 4">
    <div class="caption">Coastal views of Mombasa</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=5" alt="Kenya scene 5">
    <div class="caption">Local market life</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=6" alt="Kenya scene 6">
    <div class="caption">Mount Kenya highlands</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=7" alt="Kenya scene 7">
    <div class="caption">Lake Nakuru flamingos</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=8" alt="Kenya scene 8">
    <div class="caption">Rift Valley landscapes</div>
  </div>
  <div class="gallery-item">
    <img src="https://picsum.photos/400/300?random=9" alt="Kenya scene 9">
    <div class="caption">Everyday street scenes</div>
  </div>
</main>

</body>
</html>
