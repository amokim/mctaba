<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Fire Trivia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Quick Fire Trivia</h1>
    </header>
    <main>
        <section id="start-screen" class="screen">
            <h2>Ready to test yourself!</h2>
            <p>Answer 10 questions. You have 15 seconds per question.</p>
            <p id="last-score-display"></p>
            <div id="leaderboard-section" class="leaderboard hidden">
                <h3>🏆 Top Scores</h3>
                <ol id="leaderboard-list"></ol>
            </div>
            <form class="selection-form">
                <fieldset class="option-group">
                    <legend>Select Quiz Category</legend>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="cat-geography" name="category" value="geography" checked>
                            <label for="cat-geography">Geography</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="cat-technology" name="category" value="technology">
                            <label for="cat-technology">Technology</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="cat-culture" name="category" value="culture">
                            <label for="cat-culture">Culture</label>
                        </div>
                    </div>
                </fieldset>
            </form>
            <form class="selection-form">
                <fieldset class="option-group">
                    <legend>Select Difficulty Level</legend>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="diff-easy" name="difficulty" value="easy" checked>
                            <label for="diff-easy">Easy</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="diff-medium" name="difficulty" value="medium">
                            <label for="diff-medium">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="diff-hard" name="difficulty" value="hard">
                            <label for="diff-hard">Hard</label>
                        </div>
                    </div>
                </fieldset>
            </form>
            <button id="start-btn">Start Quiz</button>
        </section>

        <section id="quiz-screen" class="screen hidden">
            <div class="quiz-status-bar">
                <span id="question-progress"></span>
                <span id="timer">15 seconds</span>
            </div>

            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <h2 id="question-text"></h2>
            <ul id="answer-list"></ul>
            <p id="answer-feedback" class="hidden"></p>
        </section>

        <section id="results-screen" class="screen hidden">
            <h2>Trivia Complete</h2>
            <p id="final-score"></p>
            <p id="final-grade"></p>
            <p id="final-message"></p>
            <button id="share-score-btn">Share Score</button>
            <button id="review-btn">Review Answers</button>
            <button id="restart-btn">Restart Trivia</button>
            <p id="share-confirmation" class="hidden">Copied to clipboard!</p>
        </section>

        <section id="review-screen" class="screen hidden">
            <h2>Review Your Answers</h2>
            <ul id="review-list"></ul>
            <button id="back-to-results-btn">Back to Results</button>
        </section>
    </main>
    <script src="questions.js"></script>
    <script src="script.js"> </script>
</body>
</html>
